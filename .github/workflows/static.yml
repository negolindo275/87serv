<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>87 Serviços e Soluções | Segurança, Facilities & Paisagismo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold: #D4A017;
            --gold-light: #F5C842;
            --gold-dark: #B8860B;
            --dark: #0A0E1A;
            --dark-light: #141B2D;
            --dark-card: #1A2236;
            --white: #FFFFFF;
            --gray: #8B92A8;
            --green: #4CAF50;
            --green-light: #81C784;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--white);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3, h4 {
            font-family: 'Montserrat', sans-serif;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 160, 23, 0.1);
            transition: all 0.3s ease;
        }

        .navbar.scrolled {
            padding: 0.7rem 5%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--dark);
            font-family: 'Montserrat', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.3));
        }

        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            line-height: 1.2;
        }

        .logo-text span {
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: 500;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--gray);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--dark) !important;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-weight: 600 !important;
            transition: transform 0.3s, box-shadow 0.3s !important;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 160, 23, 0.4);
        }

        .nav-cta::after {
            display: none !important;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 120px 5% 80px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(212, 160, 23, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(76, 175, 80, 0.06) 0%, transparent 50%),
                linear-gradient(180deg, var(--dark) 0%, var(--dark-light) 100%);
        }

        .hero-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(212, 160, 23, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 160, 23, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 900px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 160, 23, 0.1);
            border: 1px solid rgba(212, 160, 23, 0.3);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease;
        }

        .hero-badge i {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.8s ease 0.1s both;
        }

        .hero h1 .highlight {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto 2.5rem;
            line-height: 1.7;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .btn {
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--dark);
            box-shadow: 0 10px 40px rgba(212, 160, 23, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(212, 160, 23, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--white);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-3px);
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 4rem;
            margin-top: 4rem;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--gold);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--gray);
            margin-top: 0.3rem;
        }

        /* ===== CONCEITO CENTRAL ===== */
        .concept {
            padding: 100px 5%;
            background: var(--dark-light);
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--gray);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .concept-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .concept-card {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .concept-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .concept-card:hover::before {
            transform: scaleX(1);
        }

        .concept-card:hover {
            transform: translateY(-10px);
            border-color: rgba(212, 160, 23, 0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .concept-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .concept-card:nth-child(1) .concept-icon {
            background: rgba(212, 160, 23, 0.15);
            color: var(--gold);
        }

        .concept-card:nth-child(2) .concept-icon {
            background: rgba(76, 175, 80, 0.15);
            color: var(--green);
        }

        .concept-card:nth-child(3) .concept-icon {
            background: rgba(139, 195, 74, 0.15);
            color: #8BC34A;
        }

        .concept-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
        }

        .concept-card p {
            color: var(--gray);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .concept-sincronia {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(212, 160, 23, 0.05), rgba(76, 175, 80, 0.05));
            border-radius: 20px;
            border: 1px solid rgba(212, 160, 23, 0.1);
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .concept-sincronia h3 {
            color: var(--gold);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .concept-sincronia p {
            color: var(--gray);
        }

        /* ===== SERVIÇOS ===== */
        .services {
            padding: 100px 5%;
            position: relative;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        .service-card {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .service-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(212, 160, 23, 0.05), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 160, 23, 0.2);
        }

        .service-card:hover::after {
            opacity: 1;
        }

        .service-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 1.2rem;
            position: relative;
            z-index: 1;
        }

        .service-card:nth-child(1) .service-icon { background: rgba(212, 160, 23, 0.15); color: var(--gold); }
        .service-card:nth-child(2) .service-icon { background: rgba(255, 193, 7, 0.15); color: #FFC107; }
        .service-card:nth-child(3) .service-icon { background: rgba(76, 175, 80, 0.15); color: var(--green); }
        .service-card:nth-child(4) .service-icon { background: rgba(33, 150, 243, 0.15); color: #2196F3; }
        .service-card:nth-child(5) .service-icon { background: rgba(156, 39, 176, 0.15); color: #9C27B0; }
        .service-card:nth-child(6) .service-icon { background: rgba(233, 30, 99, 0.15); color: #E91E63; }

        .service-card h3 {
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .service-card p {
            color: var(--gray);
            font-size: 0.9rem;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .service-card .service-cta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 1rem;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .service-card:hover .service-cta {
            opacity: 1;
            transform: translateX(0);
        }

        /* ===== DIFERENCIAIS ===== */
        .diferenciais {
            padding: 100px 5%;
            background: var(--dark-light);
        }

        .diferenciais-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .diferencial-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1.5rem;
            background: var(--dark-card);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
        }

        .diferencial-item:hover {
            border-color: rgba(212, 160, 23, 0.2);
            transform: translateX(5px);
        }

        .diferencial-icon {
            width: 45px;
            height: 45px;
            min-width: 45px;
            border-radius: 12px;
            background: rgba(212, 160, 23, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.1rem;
        }

        .diferencial-text h4 {
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }

        .diferencial-text p {
            color: var(--gray);
            font-size: 0.85rem;
        }

        /* ===== CONTATO ===== */
        .contact {
            padding: 100px 5%;
            position: relative;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }

        .contact-info h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .contact-info > p {
            color: var(--gray);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
            padding: 1rem;
            background: var(--dark-card);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
        }

        .contact-item:hover {
            border-color: rgba(212, 160, 23, 0.2);
            transform: translateX(5px);
        }

        .contact-item i {
            width: 45px;
            height: 45px;
            min-width: 45px;
            border-radius: 12px;
            background: rgba(212, 160, 23, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
        }

        .contact-item a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .contact-item a:hover {
            color: var(--gold);
        }

        .contact-form {
            background: var(--dark-card);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--gray);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.1);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--dark);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .form-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 160, 23, 0.3);
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 60px 5% 30px;
            background: var(--dark);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .footer-content {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 3rem;
            max-width: 1200px;
            margin: 0 auto 3rem;
        }

        .footer-brand .logo {
            margin-bottom: 1rem;
        }

        .footer-brand p {
            color: var(--gray);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .footer-column h4 {
            font-size: 1rem;
            margin-bottom: 1.2rem;
            color: var(--gold);
        }

        .footer-column ul {
            list-style: none;
        }

        .footer-column li {
            margin-bottom: 0.7rem;
        }

        .footer-column a {
            color: var(--gray);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .footer-column a:hover {
            color: var(--gold);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: var(--gray);
            font-size: 0.85rem;
        }

        /* ===== CHATBOT ===== */
        .chatbot-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
        }

        .chatbot-toggle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            color: var(--dark);
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(212, 160, 23, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .chatbot-toggle:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .chatbot-toggle .pulse-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .chatbot-toggle .notification-dot {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 12px;
            height: 12px;
            background: #FF4444;
            border-radius: 50%;
            border: 2px solid var(--dark);
        }

        .chatbot-window {
            position: absolute;
            bottom: 85px;
            right: 0;
            width: 400px;
            max-height: 600px;
            background: var(--dark-card);
            border-radius: 24px;
            border: 1px solid rgba(212, 160, 23, 0.2);
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            overflow: hidden;
            display: none;
            flex-direction: column;
            animation: chatSlideUp 0.4s ease;
        }

        .chatbot-window.active {
            display: flex;
        }

        @keyframes chatSlideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chatbot-header {
            padding: 1.2rem 1.5rem;
            background: linear-gradient(135deg, rgba(212, 160, 23, 0.15), rgba(212, 160, 23, 0.05));
            border-bottom: 1px solid rgba(212, 160, 23, 0.1);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chatbot-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .chatbot-header-info h4 {
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .chatbot-header-info span {
            font-size: 0.8rem;
            color: var(--green-light);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chatbot-header-info span::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .chatbot-close {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--gray);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .chatbot-close:hover {
            color: var(--white);
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 400px;
        }

        .chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: rgba(212, 160, 23, 0.3);
            border-radius: 3px;
        }

        .message {
            max-width: 85%;
            padding: 0.9rem 1.2rem;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.6;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: var(--dark);
            color: var(--white);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .message.user {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--dark);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .message.typing {
            display: flex;
            gap: 4px;
            padding: 1rem 1.2rem;
        }

        .message.typing span {
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .message.typing span:nth-child(2) { animation-delay: 0.2s; }
        .message.typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .chatbot-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0 1.5rem 1rem;
        }

        .chat-option {
            padding: 0.6rem 1rem;
            background: rgba(212, 160, 23, 0.1);
            border: 1px solid rgba(212, 160, 23, 0.2);
            border-radius: 50px;
            color: var(--gold);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .chat-option:hover {
            background: var(--gold);
            color: var(--dark);
        }

        .chatbot-input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 0.5rem;
        }

        .chatbot-input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .chatbot-input:focus {
            border-color: var(--gold);
        }

        .chatbot-input::placeholder {
            color: var(--gray);
        }

        .chatbot-send {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            color: var(--dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }

        .chatbot-send:hover {
            transform: scale(1.1);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }
            .footer-content {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .mobile-menu-btn {
                display: block;
            }
            .hero-stats {
                gap: 2rem;
                flex-wrap: wrap;
            }
            .chatbot-window {
                width: calc(100vw - 40px);
                right: -10px;
            }
            .footer-content {
                grid-template-columns: 1fr;
            }
        }

        /* ===== WHATSAPP FLOAT ===== */
        .whatsapp-float {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
