            z-index: 10000;
            transform: translateX(150%);
            transition: transform 0.4s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .toast.show {
            transform: translateX(0);
        }
    </style>
</head>
